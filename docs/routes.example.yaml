# MIRROR — optional site configuration
#
# This file is NOT part of the theme and cannot be shipped inside a theme zip: routes.yaml is
# site configuration, not theme code. It lives here, outside ghost/, so the staging step cannot
# pick it up by accident — a path is a stronger guarantee than an exclude rule.
#
# Upload it in Ghost admin under Settings → Labs → Routes. Every MIRROR template renders
# correctly without it; this only changes which Surface owns which URL.
#
# What it buys
# ------------
# Bare (no routes.yaml), `/` is the posts collection: Ghost renders home.hbs for page 1 and
# index.hbs for /page/2/ onwards, so the magazine cover and the Feed share one URL and the Feed
# is only reachable as page two of the homepage.
#
# With this file the cover keeps `/` — where it is still page 1 of the collection, so it still
# paginates — and the Feed gains a URL of its own at /archive/ that paginates independently.
#
# Why /archive/ is a channel and not a second collection
# ------------------------------------------------------
# A post lives in exactly one collection, so two collections cannot both own these posts. A
# `route:` would give /archive/ a URL but no posts context and no pagination at all, which is
# the wrong trade for the Surface whose whole job is paging through everything.
#
# `controller: channel` is the third option and the right one: a channel is a paginated view
# over posts that does not own their permalinks, so the collection at `/` keeps issuing
# /{slug}/ and /archive/ lists the same posts with a page count of its own. Ghost resolves a
# channel's page size exactly as it does a collection's — `limit:` here if present, otherwise
# `posts_per_page` from the theme's package.json.
#
# What it costs
# -------------
# The homepage's editorial slots cannot read `posts`, because a publication may instead hand `/`
# to a `route:`, which has no posts context. Every slot in home.hbs is therefore a {{#get}}, and
# the template renders identically in all three configurations.

collections:
  /:
    permalink: /{slug}/
    # No `template:` — Ghost renders home.hbs on `/` and index.hbs on /page/2/ onwards, which
    # is the cover on page 1 and the Feed layout beyond it. Naming a template here would put
    # the cover, and its fixed twelve most recent posts, on every page.

routes:
  /archive/:
    controller: channel
    template: index
    # limit: 18   # uncomment to page the Feed differently from the rest of the site

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
